<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Wagon</title>
    <meta name="description" content="Food Wagon" />
    <meta name="description" content="food website" />
    <meta name="keywords" content="noodles" />
    <link rel="stylesheet" href="style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="./assets/favicon_io/site.webmanifest">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="">
      <img src="./assets/logo.png" alt="Food Wagon logo " id="navlogo" />
      <p id="navtext">
        <b>Deliver To :  <i class="fa-solid fa-location-dot"></i></b>Current
        Location<b>Mohammadpur Bus Stand , Dhaka</b>
      </p>
      <div>
        <input type="search" id="search" placeholder=" Search Food" /><button
          id="login"
        >
          <i class="fa-solid fa-user-tie"></i> Log in
        </button>
      </div>
    </nav>
    <div id="herosection">
      <div>
        <h1 id="main">Are You Starving?</h1>
        <p id="maint">
        Within a few clicks, find meals that are accessible near you
        </p>
        <div id="card">
        <div>
        <button id="delivery"  ><i class="fa-solid fa-motorcycle"></i> Delivery</button>
        <button id="pickup"><i class="fa-solid fa-bag-shopping"></i> Pickup</button>
        </div>
        <div>
        <hr id="break">
        <input type="search" id="menusearch" placeholder="Enter Your Address ">
        <button id="find"><i class="fa-solid fa-magnifying-glass"></i> Find Food</button>
        </div>
        </div> 
        </div>
      <img src="./assets/noodles.png" alt="Noodles.png" id="noodle" />
    </div>
        
  </body>
</html>
